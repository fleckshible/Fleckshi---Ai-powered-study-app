<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revision Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cover: #1C3829;
    --cover-deep: #14291E;
    --cover-line: rgba(245,241,230,0.14);
    --page: #F5F1E6;
    --page-alt: #EFEADB;
    --ink: #24302A;
    --ink-soft: #5B6459;
    --rule: #C9C2A6;
    --rule-strong: #B7AF8F;
    --red: #B23A32;
    --level1: #4C7EA8;
    --level2: #C97F2E;
    --level3: #3F7D4F;
    --cream: #F5F1E6;
  }
  :root:not([data-theme="light"]) {
    /* default = light; dark overrides below only apply under explicit dark */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #1B1D18;
      --page-alt: #232519;
      --ink: #E9E4D3;
      --ink-soft: #9C9686;
      --rule: #3A3B30;
      --rule-strong: #4A4B3B;
      --cover: #0F1F16;
      --cover-deep: #0A1610;
    }
  }
  :root[data-theme="dark"] {
    --page: #1B1D18;
    --page-alt: #232519;
    --ink: #E9E4D3;
    --ink-soft: #9C9686;
    --rule: #3A3B30;
    --rule-strong: #4A4B3B;
    --cover: #0F1F16;
    --cover-deep: #0A1610;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  h1, h2, h3, .serif { font-family: 'Spectral', serif; }

  .app {
    display: flex;
    min-height: 100vh;
    max-width: 1180px;
    margin: 0 auto;
  }

  /* ---------- Sidebar (ledger cover) ---------- */
  .cover {
    background: linear-gradient(160deg, var(--cover), var(--cover-deep));
    color: var(--cream);
    width: 300px;
    flex-shrink: 0;
    padding: 32px 24px 24px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .cover-title {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin: 0 0 2px;
    color: var(--cream);
  }
  .cover-sub {
    font-size: 13px;
    color: rgba(245,241,230,0.62);
    margin: 0 0 28px;
    line-height: 1.5;
  }
  .subject-list {
    list-style: none;
    margin: 0 0 16px;
    padding: 0;
    flex: 1;
    overflow-y: auto;
  }
  .subject-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px;
    margin-bottom: 6px;
    border-radius: 3px;
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .subject-item:hover { background: rgba(245,241,230,0.06); }
  .subject-item.active {
    background: rgba(245,241,230,0.10);
    border-left-color: var(--level2);
  }
  .subject-name {
    font-size: 15px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .subject-meta {
    font-size: 11px;
    color: rgba(245,241,230,0.5);
    margin-top: 2px;
  }
  .subject-progress-ring {
    flex-shrink: 0;
    width: 30px; height: 30px;
    position: relative;
  }
  .subject-progress-ring svg { transform: rotate(-90deg); }
  .subject-progress-ring circle.bg { stroke: rgba(245,241,230,0.15); }
  .subject-progress-ring circle.fg { stroke: var(--level3); transition: stroke-dashoffset 0.3s ease; }
  .subject-progress-ring .pct {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: rgba(245,241,230,0.85);
  }
  .subject-del {
    background: none; border: none; color: rgba(245,241,230,0.35);
    cursor: pointer; font-size: 15px; padding: 2px 4px; line-height: 1;
    flex-shrink: 0;
  }
  .subject-del:hover { color: var(--red); }

  .add-subject-form {
    display: flex; gap: 6px;
    border-top: 1px solid var(--cover-line);
    padding-top: 16px;
  }
  .add-subject-form input {
    flex: 1;
    background: rgba(245,241,230,0.08);
    border: 1px solid rgba(245,241,230,0.18);
    border-radius: 3px;
    color: var(--cream);
    padding: 9px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  .add-subject-form input::placeholder { color: rgba(245,241,230,0.4); }
  .add-subject-form input:focus { outline: none; border-color: var(--level2); }
  .add-subject-form button {
    background: var(--level2);
    color: #1C1508;
    border: none;
    border-radius: 3px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .add-subject-form button:hover { filter: brightness(1.08); }

  /* ---------- Main page ---------- */
  .page {
    flex: 1;
    padding: 40px 48px 60px;
    min-width: 0;
  }
  .empty-state {
    margin-top: 80px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty-state h2 { font-size: 22px; margin-bottom: 8px; color: var(--ink); }
  .empty-state p { font-size: 14px; max-width: 360px; margin: 0 auto; line-height: 1.6; }

  .subject-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .subject-header h1 { font-size: 32px; margin: 0; font-weight: 600; }
  .tally {
    display: flex;
    gap: 22px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .tally b { color: var(--ink); font-size: 17px; font-family: 'Spectral', serif; display: block; }

  .legend {
    display: flex;
    gap: 20px;
    margin: 18px 0 20px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .legend .l1 { background: var(--level1); }
  .legend .l2 { background: var(--level2); }
  .legend .l3 { background: var(--level3); }

  .add-topic-form {
    display: flex; gap: 8px;
    margin-bottom: 10px;
  }
  .add-topic-form input {
    flex: 1;
    background: var(--page-alt);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    padding: 11px 13px;
    font-size: 14.5px;
    font-family: inherit;
    color: var(--ink);
  }
  .add-topic-form input:focus { outline: none; border-color: var(--level3); }
  .add-topic-form button {
    background: var(--ink);
    color: var(--page);
    border: none;
    border-radius: 3px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .add-topic-form button:hover { filter: brightness(1.15); }

  .topic-list { list-style: none; margin: 24px 0 0; padding: 0; }
  .topic-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 13px 4px;
    border-bottom: 1px solid var(--rule);
  }
  .topic-row:first-child { border-top: 1px solid var(--rule); }
  .topic-name {
    flex: 1;
    font-size: 15px;
    min-width: 0;
    overflow-wrap: break-word;
  }
  .topic-name.done-all { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--rule-strong); }

  .marks { display: flex; gap: 6px; flex-shrink: 0; }
  .mark-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1.5px solid var(--rule-strong);
    background: transparent;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Spectral', serif;
    color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .mark-btn:hover { transform: scale(1.08); }
  .mark-btn:active { transform: scale(0.94); }
  .mark-btn.m1.on { background: var(--level1); border-color: var(--level1); color: #fff; }
  .mark-btn.m2.on { background: var(--level2); border-color: var(--level2); color: #fff; }
  .mark-btn.m3.on { background: var(--level3); border-color: var(--level3); color: #fff; }

  .topic-del {
    background: none; border: none; color: var(--rule-strong);
    cursor: pointer; font-size: 17px; padding: 4px 2px; line-height: 1;
    flex-shrink: 0;
  }
  .topic-del:hover { color: var(--red); }

  .topic-empty {
    color: var(--ink-soft);
    font-size: 13.5px;
    padding: 20px 4px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }

  /* mobile */
  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .cover {
      width: 100%;
      min-height: auto;
      padding: 20px 18px;
    }
    .subject-list {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      flex: none;
      padding-bottom: 4px;
    }
    .subject-item { flex-shrink: 0; min-width: 150px; margin-bottom: 0; }
    .cover-sub { margin-bottom: 16px; }
    .page { padding: 28px 20px 48px; }
    .subject-header h1 { font-size: 26px; }
    .tally { gap: 14px; }
    .mark-btn { width: 30px; height: 30px; font-size: 12.5px; }
  }
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
(function() {
  var STORAGE_KEY = 'revision-ledger-v1';
  var LEVELS = [
    { key: 'read', short: 'R', label: 'Read once', cls: 'm1' },
    { key: 'revised', short: 'Rv', label: 'Revised', cls: 'm2' },
    { key: 'practiced', short: 'P', label: 'Practiced', cls: 'm3' }
  ];

  var state = { subjects: [], activeSubjectId: null };

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.subjects)) state = parsed;
      }
    } catch (e) {
      console.error('Load failed', e);
    }
    if (!state.activeSubjectId && state.subjects.length) {
      state.activeSubjectId = state.subjects[0].id;
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Save failed', e);
    }
  }

  function getActiveSubject() {
    return state.subjects.find(function(s) { return s.id === state.activeSubjectId; }) || null;
  }

  function subjectStats(subject) {
    var topics = subject.topics || [];
    var total = topics.length;
    var counts = { read: 0, revised: 0, practiced: 0 };
    topics.forEach(function(t) {
      LEVELS.forEach(function(l) { if (t[l.key]) counts[l.key]++; });
    });
    var totalMarks = total * 3;
    var filledMarks = counts.read + counts.revised + counts.practiced;
    var pct = totalMarks ? Math.round((filledMarks / totalMarks) * 100) : 0;
    return { total: total, counts: counts, pct: pct };
  }

  function ringSvg(pct, size) {
    size = size || 30;
    var r = (size - 6) / 2;
    var c = size / 2;
    var circumference = 2 * Math.PI * r;
    var offset = circumference * (1 - pct / 100);
    return '<div class="subject-progress-ring">' +
      '<svg width="' + size + '" height="' + size + '">' +
      '<circle class="bg" cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke-width="3"></circle>' +
      '<circle class="fg" cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke-width="3" ' +
      'stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '" stroke-linecap="round"></circle>' +
      '</svg><div class="pct">' + pct + '</div></div>';
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    var app = document.getElementById('app');
    var active = getActiveSubject();

    var sidebarItems = state.subjects.map(function(s) {
      var stats = subjectStats(s);
      var activeCls = s.id === state.activeSubjectId ? ' active' : '';
      return '<li class="subject-item' + activeCls + '" data-subject="' + s.id + '">' +
        '<div style="min-width:0; flex:1;">' +
          '<div class="subject-name">' + escapeHtml(s.name) + '</div>' +
          '<div class="subject-meta">' + stats.total + (stats.total === 1 ? ' topic' : ' topics') + '</div>' +
        '</div>' +
        ringSvg(stats.pct) +
        '<button class="subject-del" data-del-subject="' + s.id + '" title="Delete subject" aria-label="Delete ' + escapeHtml(s.name) + '">\u00d7</button>' +
        '</li>';
    }).join('');

    var sidebar =
      '<div class="cover">' +
        '<h1 class="cover-title serif">Revision Ledger</h1>' +
        '<p class="cover-sub">Add your subjects, then break each into topics from your syllabus. Mark every topic as you read, revise and practice it.</p>' +
        '<ul class="subject-list">' + sidebarItems + '</ul>' +
        '<form class="add-subject-form" id="addSubjectForm">' +
          '<input type="text" id="newSubjectInput" placeholder="New subject, e.g. Organic Chemistry" autocomplete="off">' +
          '<button type="submit">Add</button>' +
        '</form>' +
      '</div>';

    var pageHtml;
    if (!active) {
      pageHtml = '<div class="page">' +
        '<div class="empty-state">' +
          '<h2 class="serif">No subject yet</h2>' +
          '<p>Add a subject on the left to start listing topics from your syllabus and tracking how far you\u2019ve gotten with each one.</p>' +
        '</div>' +
      '</div>';
    } else {
      var stats = subjectStats(active);
      var topicsHtml;
      if (!active.topics || !active.topics.length) {
        topicsHtml = '<div class="topic-empty">No topics added yet. Type a topic from your syllabus above and hit Add.</div>';
      } else {
        topicsHtml = active.topics.map(function(t) {
          var allDone = t.read && t.revised && t.practiced;
          var marks = LEVELS.map(function(l) {
            var on = t[l.key] ? ' on' : '';
            return '<button class="mark-btn ' + l.cls + on + '" data-topic="' + t.id + '" data-level="' + l.key + '" title="' + l.label + '" aria-label="' + l.label + (t[l.key] ? ', done' : ', not done') + '">' + l.short + '</button>';
          }).join('');
          return '<li class="topic-row">' +
            '<div class="topic-name' + (allDone ? ' done-all' : '') + '">' + escapeHtml(t.name) + '</div>' +
            '<div class="marks">' + marks + '</div>' +
            '<button class="topic-del" data-del-topic="' + t.id + '" title="Delete topic" aria-label="Delete ' + escapeHtml(t.name) + '">\u00d7</button>' +
          '</li>';
        }).join('');
      }

      pageHtml = '<div class="page">' +
        '<div class="subject-header">' +
          '<h1 class="serif">' + escapeHtml(active.name) + '</h1>' +
          '<div class="tally">' +
            '<div><b>' + stats.counts.read + '/' + stats.total + '</b>read</div>' +
            '<div><b>' + stats.counts.revised + '/' + stats.total + '</b>revised</div>' +
            '<div><b>' + stats.counts.practiced + '/' + stats.total + '</b>practiced</div>' +
          '</div>' +
        '</div>' +
        '<div class="legend">' +
          '<span><i class="l1"></i>Read once</span>' +
          '<span><i class="l2"></i>Revised</span>' +
          '<span><i class="l3"></i>Practiced</span>' +
        '</div>' +
        '<form class="add-topic-form" id="addTopicForm">' +
          '<input type="text" id="newTopicInput" placeholder="Add a topic from your syllabus" autocomplete="off">' +
          '<button type="submit">Add topic</button>' +
        '</form>' +
        '<ul class="topic-list">' + topicsHtml + '</ul>' +
      '</div>';
    }

    app.innerHTML = sidebar + pageHtml;
    attachEvents();
  }

  function attachEvents() {
    var addSubjectForm = document.getElementById('addSubjectForm');
    if (addSubjectForm) {
      addSubjectForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var input = document.getElementById('newSubjectInput');
        var name = input.value.trim();
        if (!name) return;
        var subject = { id: uid(), name: name, topics: [] };
        state.subjects.push(subject);
        state.activeSubjectId = subject.id;
        save();
        render();
      });
    }

    document.querySelectorAll('[data-subject]').forEach(function(el) {
      el.addEventListener('click', function(e) {
        if (e.target.closest('[data-del-subject]')) return;
        state.activeSubjectId = el.getAttribute('data-subject');
        save();
        render();
      });
    });

    document.querySelectorAll('[data-del-subject]').forEach(function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        var id = el.getAttribute('data-del-subject');
        var subj = state.subjects.find(function(s) { return s.id === id; });
        if (!confirm('Delete "' + (subj ? subj.name : 'this subject') + '" and all its topics?')) return;
        state.subjects = state.subjects.filter(function(s) { return s.id !== id; });
        if (state.activeSubjectId === id) {
          state.activeSubjectId = state.subjects.length ? state.subjects[0].id : null;
        }
        save();
        render();
      });
    });

    var addTopicForm = document.getElementById('addTopicForm');
    if (addTopicForm) {
      addTopicForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var input = document.getElementById('newTopicInput');
        var name = input.value.trim();
        if (!name) return;
        var active = getActiveSubject();
        if (!active) return;
        active.topics.push({ id: uid(), name: name, read: false, revised: false, practiced: false });
        save();
        render();
        // refocus input after re-render
        var newInput = document.getElementById('newTopicInput');
        if (newInput) newInput.focus();
      });
    }

    document.querySelectorAll('.mark-btn').forEach(function(el) {
      el.addEventListener('click', function() {
        var topicId = el.getAttribute('data-topic');
        var level = el.getAttribute('data-level');
        var active = getActiveSubject();
        if (!active) return;
        var topic = active.topics.find(function(t) { return t.id === topicId; });
        if (!topic) return;
        topic[level] = !topic[level];
        save();
        render();
      });
    });

    document.querySelectorAll('[data-del-topic]').forEach(function(el) {
      el.addEventListener('click', function() {
        var id = el.getAttribute('data-del-topic');
        var active = getActiveSubject();
        if (!active) return;
        active.topics = active.topics.filter(function(t) { return t.id !== id; });
        save();
        render();
      });
    });
  }

  load();
  render();
})();
</script>
</body>
</html>
